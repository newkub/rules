id: stripe-no-stripe-secret-in-client
language: TypeScript
message: Stripe secret key (sk_*) must never appear in client-side code (Svelte component, .ts under src/routes)
severity: error
rule:
  pattern: "$X = $Y"
  regex: "[\"']sk_(test|live)_[A-Za-z0-9]{16,}[\"']"
  inside:
    kind: source_file
    regex: "/(routes|lib/components|\\+page|\\+layout)/"
    stopBy: end
note: |
  The publishable key (pk_*) is safe in the client. The
  secret key (sk_*) must only be used in server-only modules
  (e.g. src/lib/server/services/payment).
