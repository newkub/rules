id: rust-no-hardcoded-secrets
language: Rust
message: Possible hardcoded secret detected - load from env / secrets manager
severity: error
rule:
  pattern: "$X = $Y"
  regex: "(?i)(api[_-]?key|secret|token|password|passwd|pwd|private[_-]?key|access[_-]?key)\\s*[:=]\\s*['\"][A-Za-z0-9_\\-\\.\\+\\/=]{16,}"
note: |
  Universal security rule. Read secrets from std::env::var(),
  config::Config, or a secrets manager (Vault, AWS SM).
