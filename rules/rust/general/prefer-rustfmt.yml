id: rust-prefer-rustfmt
language: Rust
message: Code style is enforced by rustfmt - run cargo fmt before committing
severity: hint
rule:
  kind: source_file
  regex: "\\s+$"
note: |
  Trailing whitespace, inconsistent indentation, and long
  lines are all handled by `cargo fmt`. Run it in CI and as
  a pre-commit hook.
