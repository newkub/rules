id: rust-prefer-box-for-large-struct
language: Rust
message: Wrap large structs (>256 bytes) in Box<T> to keep them off the stack
severity: hint
rule:
  kind: parameter
  regex: "[A-Z][a-zA-Z0-9_]+:\\s*\\w{20,}\\b"
note: |
  Pass large structs by Box<T> or &T to avoid stack copies.
  This rule is heuristic; the real threshold depends on
  call frequency and target architecture.
