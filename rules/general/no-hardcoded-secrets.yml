id: general-no-hardcoded-secrets
language: TypeScript
message: Possible hardcoded secret detected - move to environment variables or a secrets manager
severity: error
rule:
  pattern: "$X = $Y"
  regex: "(?i)(api[_-]?key|secret|token|password|passwd|pwd|private[_-]?key|access[_-]?key)\\s*[:=]\\s*['\"][A-Za-z0-9\\-_\\.\\+\\/=]{16,}"
note: |
  Universal security rule. Applies to any backend stack - Node,
  Bun, Deno, Python, Go, Rust. Use env vars, $env/static/private,
  Bun.env, or a secret store like Cloudflare Workers Secrets.
